# Reinforcement Learning Configuration (Gymnasium & PPO)
env:
  id: "GridShieldEnergyEnv-v0"
  max_episode_steps: 96        # 1 day (96 steps of 15 min)
  action_type: "continuous"    # [hvac_power_norm, battery_power_norm]
  normalize_observations: true
  action_clip_min: -1.0
  action_clip_max: 1.0

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  total_timesteps: 50000
  seed: 42
  eval_episodes: 5
