# Global GridShield Parameters
system:
  name: "GridShield Microgrid"
  timestep_minutes: 15
  timestep_hours: 0.25
  horizon_hours: 24
  horizon_steps: 96
  random_seed: 42

comfort:
  temp_min_c: 21.0
  temp_max_c: 24.0
  temp_target_c: 22.5
  penalty_per_deg_hour: 2.0  # lambda_T ($/degC-h)

battery:
  capacity_kwh: 100.0
  soc_min: 0.10
  soc_max: 0.95
  soc_initial: 0.50
  max_charge_power_kw: 25.0
  max_discharge_power_kw: 25.0
  charge_efficiency: 0.92
  discharge_efficiency: 0.92
  degradation_cost_per_kwh_throughput: 0.015  # lambda_D ($/kWh)

grid:
  max_import_kw: 100.0
  max_export_kw: 50.0
  export_tariff_ratio: 0.50  # compensation factor for grid export vs import tariff
  export_carbon_credit: true # gross vs net accounting flag

objective_weights:
  lambda_carbon: 0.05    # $/kgCO2 (e.g. $50/tonne CO2)
  lambda_degradation: 0.015 # $/kWh throughput
  lambda_comfort: 2.0    # $/degC-h violation
